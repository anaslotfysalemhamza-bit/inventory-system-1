<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبات الحسابات - نظام إدارة المخازن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme-engine.js"></script>
    <link rel="stylesheet" href="common-styles.css">
    <link rel="stylesheet" href="professional-toast.css">
    <link rel="stylesheet" href="sidebar.css">
    <style>
        /* ==================== RESET & BASE ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #1f2937;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .page-content {
            padding: 30px;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== TOP BAR ==================== */
        .top-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 99;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #1f2937;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            background: #f3f4f6;
            transform: scale(1.05);
        }

        .top-bar-title h2 {
            font-size: 20px;
            color: #1f2937;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar-title h2 i {
            color: #4361ee;
        }

        .top-bar-title p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notifications {
            position: relative;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .notifications:hover {
            background: #f3f4f6;
            transform: scale(1.05);
        }

        .notifications i {
            font-size: 20px;
            color: #6b7280;
        }

        .notifications .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 20px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .user-info:hover {
            background: #f3f4f6;
            transform: scale(1.02);
        }

        .user-avatar-top {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .user-avatar-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info span {
            font-weight: 600;
            color: #1f2937;
            font-size: 14px;
        }

        /* ==================== STATS CARDS - PREMIUM DESIGN ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card .stat-icon {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .stat-card.pending .stat-icon {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .stat-card.approved .stat-icon {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .stat-card.rejected .stat-icon {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .stat-card.total .stat-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .stat-card .stat-details strong {
            display: block;
            font-size: 32px;
            font-weight: 800;
            color: #1f2937;
            line-height: 1;
        }

        .stat-card .stat-details span {
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
            margin-top: 5px;
            display: block;
        }

        /* ==================== FILTER TABS - MODERN DESIGN ==================== */
        .filter-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 12px 24px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
            color: #4b5563;
            position: relative;
            overflow: hidden;
        }

        .filter-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .filter-tab:hover::before {
            left: 100%;
        }

        .filter-tab:hover {
            border-color: #4361ee;
            background: #eff6ff;
            color: #4361ee;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }

        .filter-tab.active {
            background: linear-gradient(135deg, #4361ee, #3730a3);
            color: white;
            border-color: #4361ee;
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.3);
        }

        .filter-tab i {
            font-size: 16px;
        }

        /* ==================== MODERN CARD CONTAINER ==================== */
        .modern-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-header {
            padding: 20px 25px;
            background: linear-gradient(135deg, #4361ee, #3730a3);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h3 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .card-header .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .card-body {
            padding: 25px;
        }

        /* ==================== SEARCH BAR ==================== */
        .search-bar {
            position: relative;
            margin-bottom: 25px;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
            color: #1f2937;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #4361ee;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
            transform: translateY(-2px);
        }

        .search-bar input::placeholder {
            color: #9ca3af;
        }

        .search-bar i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
            pointer-events: none;
        }

        /* ==================== REQUEST CARDS - PREMIUM DESIGN ==================== */
        .request-card {
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid #e5e7eb;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .request-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(67, 97, 238, 0.05), transparent);
            transition: left 0.6s ease;
        }

        .request-card:hover::before {
            left: 100%;
        }

        .request-card:hover {
            border-color: #4361ee;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.12);
            background: #ffffff;
            transform: translateY(-4px);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .request-user-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.3);
            border: 3px solid white;
            position: relative;
        }

        .user-avatar::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #667eea;
            top: -4px;
            left: -4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .request-card:hover .user-avatar::after {
            opacity: 1;
        }

        .user-details {
            flex: 1;
            min-width: 0;
        }

        .user-details h4 {
            font-size: 18px;
            color: #1f2937;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .user-details p {
            color: #6b7280;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .role-badge {
            background: linear-gradient(135deg, #e0e7ff, #dbeafe);
            color: #4361ee;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid #c7d2fe;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .status-badge.pending {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .status-badge.active {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .status-badge.rejected {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status-badge.suspended {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        /* ==================== REQUEST INFO GRID ==================== */
        .request-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            background: white;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            border-color: #4361ee;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.1);
            transform: translateY(-2px);
        }

        .info-item label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .info-item label i {
            color: #4361ee;
        }

        .info-item strong {
            color: #1f2937;
            font-size: 15px;
            display: block;
            font-weight: 700;
        }

        /* ==================== REQUEST ACTIONS - BEAUTIFUL BUTTONS ==================== */
        .request-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
            border-top: 2px solid #f3f4f6;
            padding-top: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn i {
            position: relative;
            z-index: 1;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-approve {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-approve:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-3px);
        }

        .btn-reject {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-reject:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            transform: translateY(-3px);
        }

        .btn-info {
            background: linear-gradient(135deg, #e5e7eb, #d1d5db);
            color: #1f2937;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #d1d5db, #9ca3af);
            transform: translateY(-3px);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .btn-warning:hover {
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-3px);
        }

        /* ==================== EMPTY STATE ==================== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .empty-state i {
            font-size: 80px;
            color: #d1d5db;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-state h3 {
            color: #4b5563;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .empty-state p {
            color: #9ca3af;
            font-size: 15px;
        }

        /* ==================== LOADING OVERLAY ==================== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            background: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-spinner i {
            font-size: 50px;
            color: #4361ee;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-spinner p {
            margin-top: 18px;
            color: #1f2937;
            font-weight: 700;
            font-size: 16px;
        }

        /* ==================== NOTIFICATION PANEL ==================== */
        .notification-panel {
            position: fixed;
            top: 75px;
            left: 30px;
            width: 350px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-panel.active {
            display: block;
        }

        .notification-panel-header {
            padding: 18px 22px;
            background: linear-gradient(135deg, #f9fafb, #f3f4f6);
            border-bottom: 2px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notification-panel-header h4 {
            font-size: 16px;
            color: #1f2937;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-panel-header button {
            background: none;
            border: none;
            color: #4361ee;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .notification-panel-header button:hover {
            background: #eff6ff;
        }

        .notification-list {
            max-height: 350px;
            overflow-y: auto;
            padding: 12px;
        }

        .empty-notifications {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
            font-size: 14px;
        }

        /* ==================== RESPONSIVE DESIGN ==================== */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(100%);
                position: fixed;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .close-sidebar {
                display: flex;
            }

            .main-content {
                margin-right: 0;
            }

            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .page-content {
                padding: 15px;
            }

            .top-bar {
                padding: 0 15px;
            }

            .user-info span {
                display: none;
            }

            .request-header {
                flex-direction: column;
            }

            .request-info {
                grid-template-columns: 1fr;
            }

            .request-actions {
                flex-direction: column;
            }

            .request-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .filter-tabs {
                gap: 8px;
            }

            .filter-tab {
                padding: 10px 18px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .top-bar-title h2 {
                font-size: 16px;
            }

            .stat-card {
                padding: 18px;
            }

            .stat-card .stat-icon {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }

            .stat-card .stat-details strong {
                font-size: 26px;
            }

            .user-avatar {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .user-details h4 {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- لوحة الإشعارات -->
    <div class="notification-panel" id="notificationPanel">
        <div class="notification-panel-header">
            <h4><i class="fas fa-bell"></i> الإشعارات</h4>
            <div>
                <button onclick="markAllNotificationsRead()">تحديد الكل</button>
                <button onclick="clearAllNotifications()">مسح الكل</button>
            </div>
        </div>
        <div class="notification-list" id="notificationList">
            <div class="empty-notifications">لا توجد إشعارات جديدة</div>
        </div>
    </div>

    <!-- مؤشر التحميل -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner"></i>
            <p>جاري التحميل...</p>
        </div>
    </div>

    <div class="app">
        <!-- الشريط الجانبي -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="top-bar-title">
                    <h2><i class="fas fa-user-check"></i> إدارة طلبات الحسابات</h2>
                    <p id="currentDateTime"></p>
                </div>
                <div class="top-bar-actions">
                    <div class="notifications" id="notificationsBtn">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="notificationBadge">0</span>
                    </div>
                    <div class="user-info" onclick="window.location.href='profile.html'">
                        <div class="user-avatar-top" id="topBarAvatar"></div>
                        <span class="user-name-top" id="userName">مدير النظام</span>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <!-- الإحصائيات -->
                <div class="stats-grid">
                    <div class="stat-card pending">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-details">
                            <strong id="pendingCount">0</strong>
                            <span>في الانتظار</span>
                        </div>
                    </div>
                    <div class="stat-card approved">
                        <div class="stat-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-details">
                            <strong id="approvedCount">0</strong>
                            <span>تم القبول</span>
                        </div>
                    </div>
                    <div class="stat-card rejected">
                        <div class="stat-icon">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="stat-details">
                            <strong id="rejectedCount">0</strong>
                            <span>تم الرفض</span>
                        </div>
                    </div>
                    <div class="stat-card total">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-details">
                            <strong id="totalCount">0</strong>
                            <span>إجمالي الطلبات</span>
                        </div>
                    </div>
                </div>

                <!-- قائمة الطلبات -->
                <div class="modern-card">
                    <div class="card-header">
                        <h3><i class="fas fa-list"></i> قائمة الطلبات</h3>
                        <button class="btn" onclick="loadRequests()">
                            <i class="fas fa-sync-alt"></i> تحديث
                        </button>
                    </div>
                    <div class="card-body">
                        <!-- Search Bar -->
                        <div class="search-bar">
                            <input type="text" id="requestsSearch" 
                                   placeholder="بحث بالاسم، البريد الإلكتروني، رقم الهاتف...">
                            <i class="fas fa-search"></i>
                        </div>

                        <!-- Filter Tabs -->
                        <div class="filter-tabs">
                            <div class="filter-tab active" onclick="filterRequests('all', this)">
                                <i class="fas fa-list"></i> <span>الكل</span>
                            </div>
                            <div class="filter-tab" onclick="filterRequests('pending', this)">
                                <i class="fas fa-clock"></i> <span>في الانتظار</span>
                            </div>
                            <div class="filter-tab" onclick="filterRequests('active', this)">
                                <i class="fas fa-check-circle"></i> <span>مقبول</span>
                            </div>
                            <div class="filter-tab" onclick="filterRequests('rejected', this)">
                                <i class="fas fa-times-circle"></i> <span>مرفوض</span>
                            </div>
                            <div class="filter-tab" onclick="filterRequests('suspended', this)">
                                <i class="fas fa-ban"></i> <span>موقوف</span>
                            </div>
                        </div>

                        <!-- Requests List -->
                        <div id="requestsList">
                            <div class="empty-state">
                                <i class="fas fa-spinner fa-spin"></i>
                                <h3>جاري تحميل الطلبات...</h3>
                                <p>يرجى الانتظار</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="professional-toast.js"></script>
    <script src="check-permission.js"></script>
    <script src="sidebar.js"></script>

    <script>
        // ==================== GLOBAL VARIABLES ====================
        let allRequests = [];
        let currentFilter = 'all';
        const API_URL = window.API_URL || 'http://localhost:5000/api';

        // ترجمة الأدوار
        const rolesMap = {
            'admin': 'مدير النظام',
            'storekeeper': 'أمين مخزن',
            'cashier': 'محاسب',
            'accountant': 'محاسب',
            'reviewer': 'مراجع'
        };

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Initializing Approve Requests Page...');

            // 1. التحقق من صلاحيات الدخول
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            // التحقق من صلاحية إدارة الطلبات
            if (currentUser.role !== 'admin') {
                showProfessionalToast('⛔ ليس لديك صلاحية الوصول لهذه الصفحة', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }

            // 2. تحديث اسم المستخدم
            const userNameEl = document.getElementById('userName');
            if (userNameEl && currentUser.name) {
                userNameEl.textContent = currentUser.name;
            }

            // 3. تحديث التاريخ والوقت
            updateDateTime();
            setInterval(updateDateTime, 1000);

            // 4. إعداد أحداث القائمة
            const menuToggle = document.getElementById('menuToggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function() {
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar) sidebar.classList.toggle('open');
                });
            }

            // 5. إعداد أحداث الإشعارات
            const notifBtn = document.getElementById('notificationsBtn');
            const notifPanel = document.getElementById('notificationPanel');
            if (notifBtn && notifPanel) {
                notifBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    notifPanel.classList.toggle('active');
                });

                document.addEventListener('click', function(e) {
                    if (!notifPanel.contains(e.target) && !notifBtn.contains(e.target)) {
                        notifPanel.classList.remove('active');
                    }
                });
            }

            // 6. إعداد البحث الحي
            const searchInput = document.getElementById('requestsSearch');
            if (searchInput) {
                searchInput.addEventListener('input', handleSearch);
            }

            // 7. تحميل الطلبات
            loadRequests();
        });

        // ==================== DATE & TIME ====================
        function updateDateTime() {
            const now = new Date();
            const dateTimeEl = document.getElementById('currentDateTime');
            if (dateTimeEl) {
                dateTimeEl.innerHTML = `<i class="far fa-calendar-alt"></i> ${now.toLocaleString('ar-EG')}`;
            }
        }

        // ==================== LOADING OVERLAY ====================
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                if (show) {
                    overlay.classList.add('active');
                } else {
                    overlay.classList.remove('active');
                }
            }
        }

        // ==================== LOAD REQUESTS ====================
        async function loadRequests() {
            showLoading(true);
            try {
                console.log('📡 Fetching requests from:', `${API_URL}/pending-accounts`);
                
                const response = await fetch(`${API_URL}/pending-accounts`);
                const result = await response.json();

                console.log('📦 Response:', result);

                if (result.success && Array.isArray(result.data)) {
                    allRequests = result.data;
                    updateStats();
                    filterRequests(currentFilter);
                    showProfessionalToast(`✅ تم تحميل ${allRequests.length} طلب`, 'success');
                } else {
                    throw new Error(result.message || 'فشل جلب الطلبات');
                }
            } catch (error) {
                console.error('❌ Error loading requests:', error);
                showProfessionalToast('حدث خطأ في تحميل الطلبات', 'error');
                document.getElementById('requestsList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>حدث خطأ</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                showLoading(false);
            }
        }

        // ==================== UPDATE STATS ====================
        function updateStats() {
            let pending = 0, approved = 0, rejected = 0;

            allRequests.forEach(req => {
                const status = (req.account_status || '').toLowerCase();
                if (status === 'pending' || !req.is_approved) {
                    pending++;
                } else if (status === 'active' || req.is_approved) {
                    approved++;
                } else if (status === 'rejected') {
                    rejected++;
                }
            });

            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('approvedCount').textContent = approved;
            document.getElementById('rejectedCount').textContent = rejected;
            document.getElementById('totalCount').textContent = allRequests.length;
        }

        // ==================== FILTER REQUESTS ====================
        function filterRequests(status, tabElement) {
            currentFilter = status;

            // تحديث active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (tabElement) {
                tabElement.classList.add('active');
            }

            // تطبيق الفلتر
            const filtered = allRequests.filter(req => {
                if (status === 'all') return true;
                
                const reqStatus = (req.account_status || '').toLowerCase();
                
                if (status === 'pending') {
                    return reqStatus === 'pending' || !req.is_approved;
                } else if (status === 'active') {
                    return reqStatus === 'active' || req.is_approved;
                } else {
                    return reqStatus === status;
                }
            });

            renderRequests(filtered);
        }

        // ==================== HANDLE SEARCH ====================
        function handleSearch() {
            const query = document.getElementById('requestsSearch').value.trim().toLowerCase();

            if (!query) {
                filterRequests(currentFilter);
                return;
            }

            const filtered = allRequests.filter(req => {
                const name = (req.name || '').toLowerCase();
                const email = (req.email || '').toLowerCase();
                const phone = (req.phone || '').toLowerCase();
                const role = (rolesMap[req.role] || req.role || '').toLowerCase();

                return name.includes(query) || 
                       email.includes(query) || 
                       phone.includes(query) || 
                       role.includes(query);
            });

            renderRequests(filtered);
        }

        // ==================== RENDER REQUESTS ====================
        function renderRequests(requests) {
            const container = document.getElementById('requestsList');

            if (!requests || requests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>لا توجد طلبات</h3>
                        <p>لم يتم العثور على أي طلبات تطابق البحث</p>
                    </div>
                `;
                return;
            }

            let html = '';

            requests.forEach(req => {
                const name = req.name || 'بدون اسم';
                const email = req.email || '---';
                const phone = req.phone || '---';
                const roleText = rolesMap[req.role] || req.role || 'غير محدد';
                const createdDate = req.created_at 
                    ? new Date(req.created_at).toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    })
                    : '---';

                // تحديد حالة الطلب
                const status = (req.account_status || '').toLowerCase();
                let statusBadgeHTML = '';
                
                if (status === 'pending' || !req.is_approved) {
                    statusBadgeHTML = '<span class="status-badge pending"><i class="fas fa-clock"></i> في الانتظار</span>';
                } else if (status === 'active' || req.is_approved) {
                    statusBadgeHTML = '<span class="status-badge active"><i class="fas fa-check-circle"></i> مفعّل</span>';
                } else if (status === 'rejected') {
                    statusBadgeHTML = '<span class="status-badge rejected"><i class="fas fa-times-circle"></i> مرفوض</span>';
                } else if (status === 'suspended') {
                    statusBadgeHTML = '<span class="status-badge suspended"><i class="fas fa-ban"></i> موقوف</span>';
                }

                // الأزرار
                let actionsHTML = '';
                if (status === 'pending' || !req.is_approved) {
                    actionsHTML = `
                        <button class="btn btn-approve" onclick="approveRequest(${req.id}, '${name.replace(/'/g, "\\'")}')">
                            <i class="fas fa-check"></i> <span>موافقة</span>
                        </button>
                        <button class="btn btn-reject" onclick="rejectRequest(${req.id}, '${name.replace(/'/g, "\\'")}')">
                            <i class="fas fa-times"></i> <span>رفض</span>
                        </button>
                    `;
                } else if (status === 'suspended') {
                    actionsHTML = `
                        <button class="btn btn-warning" onclick="activateRequest(${req.id}, '${name.replace(/'/g, "\\'")}')">
                            <i class="fas fa-check-circle"></i> <span>تفعيل الحساب</span>
                        </button>
                    `;
                } else {
                    actionsHTML = `
                        <button class="btn btn-info" onclick="viewUserDetails(${req.id})">
                            <i class="fas fa-eye"></i> <span>عرض التفاصيل</span>
                        </button>
                    `;
                }

                // الحرف الأول للاسم
                const initial = name.charAt(0).toUpperCase();

                html += `
                    <div class="request-card">
                        <div class="request-header">
                            <div class="request-user-info">
                                <div class="user-avatar">${initial}</div>
                                <div class="user-details">
                                    <h4>${name}</h4>
                                    <p>
                                        <span class="role-badge">${roleText}</span>
                                        <span style="color: #9ca3af;">•</span>
                                        <i class="far fa-calendar-alt"></i> ${createdDate}
                                    </p>
                                </div>
                            </div>
                            ${statusBadgeHTML}
                        </div>

                        <div class="request-info">
                            <div class="info-item">
                                <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                                <strong>${email}</strong>
                            </div>
                            <div class="info-item">
                                <label><i class="fas fa-phone"></i> رقم الهاتف</label>
                                <strong>${phone}</strong>
                            </div>
                            <div class="info-item">
                                <label><i class="fas fa-user-tag"></i> الدور الوظيفي</label>
                                <strong>${roleText}</strong>
                            </div>
                            <div class="info-item">
                                <label><i class="fas fa-info-circle"></i> الحالة</label>
                                <strong>${status === 'pending' ? 'في الانتظار' : status === 'active' ? 'نشط' : status === 'rejected' ? 'مرفوض' : 'موقوف'}</strong>
                            </div>
                        </div>

                        <div class="request-actions">
                            ${actionsHTML}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ==================== APPROVE REQUEST ====================
        async function approveRequest(id, name) {
            const confirmed = confirm(`هل أنت متأكد من الموافقة على طلب "${name}"؟`);
            if (!confirmed) return;

            showLoading(true);
            try {
                // البحث عن الطلب للحصول على البريد الإلكتروني
                const request = allRequests.find(req => req.id === id);
                if (!request) {
                    throw new Error('الطلب غير موجود');
                }

                // الحصول على معلومات المدير الحالي
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                
                const response = await fetch(`${API_URL}/approve-account`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: request.email,
                        approved: true,
                        adminName: currentUser?.name || 'مدير النظام',
                        reason: null
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showProfessionalToast(`✅ تم قبول طلب ${name} بنجاح`, 'success');
                    await loadRequests();
                } else {
                    throw new Error(result.message || 'فشلت عملية القبول');
                }
            } catch (error) {
                console.error('❌ Error approving request:', error);
                showProfessionalToast(error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ==================== REJECT REQUEST ====================
        async function rejectRequest(id, name) {
            const reason = prompt(`سبب رفض طلب "${name}":`);
            if (!reason) return;

            showLoading(true);
            try {
                // البحث عن الطلب للحصول على البريد الإلكتروني
                const request = allRequests.find(req => req.id === id);
                if (!request) {
                    throw new Error('الطلب غير موجود');
                }

                // الحصول على معلومات المدير الحالي
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                
                const response = await fetch(`${API_URL}/approve-account`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: request.email,
                        approved: false,
                        adminName: currentUser?.name || 'مدير النظام',
                        reason: reason
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showProfessionalToast(`✅ تم رفض طلب ${name}`, 'info');
                    await loadRequests();
                } else {
                    throw new Error(result.message || 'فشلت عملية الرفض');
                }
            } catch (error) {
                console.error('❌ Error rejecting request:', error);
                showProfessionalToast(error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ==================== ACTIVATE REQUEST ====================
        async function activateRequest(id, name) {
            const confirmed = confirm(`هل تريد تفعيل حساب "${name}"؟`);
            if (!confirmed) return;

            showLoading(true);
            try {
                // البحث عن الطلب للحصول على البريد الإلكتروني
                const request = allRequests.find(req => req.id === id);
                if (!request) {
                    throw new Error('الطلب غير موجود');
                }

                const response = await fetch(`${API_URL}/activate-account`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: request.email })
                });

                const result = await response.json();

                if (result.success) {
                    showProfessionalToast(`✅ تم تفعيل حساب ${name}`, 'success');
                    await loadRequests();
                } else {
                    throw new Error(result.message || 'فشلت عملية التفعيل');
                }
            } catch (error) {
                console.error('❌ Error activating request:', error);
                showProfessionalToast(error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ==================== VIEW USER DETAILS ====================
        function viewUserDetails(userId) {
            window.location.href = `user-details.html?id=${userId}`;
        }

        // ==================== NOTIFICATION FUNCTIONS ====================
        function markAllNotificationsRead() {
            showProfessionalToast('تم تحديد جميع الإشعارات كمقروءة', 'success');
        }

        function clearAllNotifications() {
            const list = document.getElementById('notificationList');
            if (list) {
                list.innerHTML = '<div class="empty-notifications">لا توجد إشعارات جديدة</div>';
            }
            const badge = document.getElementById('notificationBadge');
            if (badge) badge.textContent = '0';
            showProfessionalToast('تم مسح جميع الإشعارات', 'info');
        }

        // ==================== CONSOLE LOG ====================
        console.log('✅ Approve Requests Page Loaded Successfully');
    </script>
</body>
</html>
