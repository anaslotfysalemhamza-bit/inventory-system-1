<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المخازن المتقدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme-engine.js"></script>
    <!-- Professional Toast Notifications -->
    <link rel="stylesheet" href="professional-toast.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: #0f0f23;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 40px 20px;
        }

        /* خلفية متحركة متقدمة */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }


        .gradient-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #1a1a3e, #0f0f23, #1a0033);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: orbit 20s infinite ease-in-out;
            opacity: 0.5;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #667eea, transparent);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #f093fb, transparent);
            bottom: -100px;
            left: -100px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #4facfe, transparent);
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes orbit {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(100px, -100px) scale(1.2);
            }
            50% {
                transform: translate(-50px, 100px) scale(0.8);
            }
            75% {
                transform: translate(150px, 50px) scale(1.1);
            }
        }


        /* Grid Animation */
        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(102, 126, 234, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            transform: perspective(500px) rotateX(60deg);
        }

        @keyframes grid-move {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0);
            }
            100% {
                transform: perspective(500px) rotateX(60deg) translateY(50px);
            }
        }

        /* الحاوية الرئيسية */
        .login-container {
            position: relative;
            z-index: 10;
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            animation: container-entrance 0.8s ease-out;
        }

        @keyframes container-entrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }


        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            animation: fade-in-down 1s ease-out 0.2s both;
        }

        @keyframes fade-in-down {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: logo-pulse 3s ease-in-out infinite;
            box-shadow: 
                0 0 0 0 rgba(102, 126, 234, 0.7),
                0 20px 40px rgba(102, 126, 234, 0.3);
        }

        @keyframes logo-pulse {
            0%, 100% {
                box-shadow: 
                    0 0 0 0 rgba(102, 126, 234, 0.7),
                    0 20px 40px rgba(102, 126, 234, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 
                    0 0 0 20px rgba(102, 126, 234, 0),
                    0 25px 50px rgba(102, 126, 234, 0.4);
                transform: scale(1.05);
            }
        }

        .logo-circle i {
            font-size: 45px;
            color: white;
            animation: icon-rotate 4s ease-in-out infinite;
        }

        @keyframes icon-rotate {
            0%, 100% {
                transform: rotateY(0deg);
            }
            50% {
                transform: rotateY(180deg);
            }
        }


        .logo-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(102, 126, 234, 0.3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: glow-expand 2s ease-out infinite;
        }

        @keyframes glow-expand {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        .logo-section h1 {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            animation: text-shimmer 3s ease-in-out infinite;
        }

        @keyframes text-shimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .logo-section p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
        }

        /* Welcome Text */
        .welcome-text {
            text-align: center;
            margin-bottom: 35px;
            animation: fade-in-down 1s ease-out 0.4s both;
        }

        .welcome-text h2 {
            font-size: 26px;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
        }

        .welcome-text p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }


        /* Form */
        .login-form {
            animation: fade-in-up 1s ease-out 0.6s both;
        }

        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }

        .input-wrapper {
            position: relative;
            animation: slide-in-right 0.5s ease-out both;
        }

        .form-group:nth-child(1) .input-wrapper {
            animation-delay: 0.7s;
        }

        .form-group:nth-child(2) .input-wrapper {
            animation-delay: 0.85s;
        }

        @keyframes slide-in-right {
            0% {
                opacity: 0;
                transform: translateX(30px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 55px 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-family: inherit;
            font-size: 15px;
            color: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }


        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #667eea;
            outline: none;
            box-shadow: 
                0 0 0 4px rgba(102, 126, 234, 0.1),
                0 10px 30px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            transition: all 0.3s;
            pointer-events: none;
        }

        .input-wrapper input:focus + .input-icon {
            color: #667eea;
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            transition: all 0.3s;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #667eea;
            transform: translateY(-50%) scale(1.2);
        }

        .forgot-password {
            text-align: left;
            margin-top: 8px;
        }

        .forgot-password a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .forgot-password a:hover {
            color: #667eea;
        }


        .forgot-password a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            right: 0;
            background: #667eea;
            transition: width 0.3s;
        }

        .forgot-password a:hover::after {
            width: 100%;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            animation: fade-in-up 1s ease-out 1s both;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }


        /* Divider */
        .divider {
            text-align: center;
            margin: 35px 0;
            position: relative;
            animation: fade-in 1s ease-out 1.2s both;
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .divider span {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            position: relative;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Register Section */
        .register-section {
            text-align: center;
            padding: 30px 25px;
            background: linear-gradient(135deg, rgba(72, 187, 120, 0.1), rgba(56, 161, 105, 0.1));
            border-radius: 20px;
            border: 1px solid rgba(72, 187, 120, 0.2);
            position: relative;
            overflow: hidden;
            animation: fade-in-up 1s ease-out 1.4s both;
        }

        .register-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(72, 187, 120, 0.1), transparent);
            animation: register-glow 4s ease-in-out infinite;
        }

        @keyframes register-glow {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(10%, 10%);
            }
        }


        .register-section p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }

        .btn-register-request {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 35px;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.3);
            overflow: hidden;
        }

        .btn-register-request::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-register-request:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-register-request:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(72, 187, 120, 0.4);
        }

        .btn-register-request i {
            position: relative;
            z-index: 2;
            animation: bounce-icon 2s ease-in-out infinite;
        }

        @keyframes bounce-icon {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }


        /* Alerts */
        .alert {
            padding: 24px 28px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: none;
            align-items: flex-start;
            gap: 16px;
            font-size: 15px;
            line-height: 1.8;
            animation: alert-slide-down 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            max-width: 100%;
            word-wrap: break-word;
            backdrop-filter: blur(10px);
        }

        .alert i {
            font-size: 24px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .alert #errorText,
        .alert #successText {
            flex: 1;
        }

        .alert #errorText strong,
        .alert #successText strong {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .alert #errorText p,
        .alert #successText p {
            margin: 6px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert #errorText p i,
        .alert #successText p i {
            font-size: 16px;
            margin-top: 2px;
            opacity: 0.8;
        }

        @keyframes alert-slide-down {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            animation: alert-bar 2s ease-in-out infinite;
        }

        @keyframes alert-bar {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .alert-error {
            background: rgba(229, 62, 62, 0.1);
            border: 1px solid rgba(229, 62, 62, 0.3);
            color: #fc8181;
        }

        .alert-error::before {
            background: #fc8181;
        }

        .alert-success {
            background: rgba(72, 187, 120, 0.1);
            border: 1px solid rgba(72, 187, 120, 0.3);
            color: #68d391;
        }

        .alert-success::before {
            background: #68d391;
        }

        .alert i {
            font-size: 20px;
            animation: alert-icon-pulse 1.5s ease-in-out infinite;
        }

        @keyframes alert-icon-pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }


        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spinner-rotate 0.8s linear infinite;
        }

        @keyframes spinner-rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        .footer-text {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: fade-in 1s ease-out 1.6s both;
        }

        .footer-text p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            line-height: 1.8;
        }

        .footer-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .footer-text a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* ==================== REJECTION MODAL ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: modalSlideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .rejection-modal {
            border: 2px solid rgba(239, 68, 68, 0.3);
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
                transform: scale(1.05);
            }
        }

        .modal-icon i {
            font-size: 42px;
            color: #fc8181;
            animation: iconShake 0.5s ease-in-out;
        }

        @keyframes iconShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .modal-body {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-info-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal-info-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .modal-info-item i {
            font-size: 20px;
            color: #fc8181;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .modal-info-content {
            flex: 1;
        }

        .modal-info-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-info-value {
            font-size: 16px;
            color: white;
            font-weight: 700;
            line-height: 1.5;
        }

        .modal-footer-note {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .modal-footer-note i {
            color: #667eea;
            font-size: 18px;
            margin-top: 2px;
        }

        .modal-footer-note p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .modal-close-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .modal-close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .modal-close-btn:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 20px 15px;
            }

            .login-container {
                padding: 40px 25px;
            }

            .logo-circle {
                width: 80px;
                height: 80px;
            }

            .logo-circle i {
                font-size: 35px;
            }

            .logo-section h1 {
                font-size: 28px;
            }

            .welcome-text h2 {
                font-size: 22px;
            }

            .notification-toast {
                min-width: 280px;
                right: 15px;
                top: 15px;
            }
        }
    </style>
    </head>


<body>
    <!-- خلفية متحركة -->
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="grid-bg"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- الحاوية الرئيسية -->
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-wrapper">
                <div class="logo-circle">
                    <i class="fas fa-boxes-stacked"></i>
                </div>
                <div class="logo-glow"></div>
            </div>
            <h1>مخزني</h1>
            <p>نظام إدارة المخازن المتقدم</p>
        </div>

        <!-- Welcome Text -->
        <div class="welcome-text">
            <h2>مرحباً بعودتك</h2>
            <p>سجل دخولك للوصول إلى لوحة التحكم</p>
        </div>

        <!-- Alerts -->
        <div class="alert alert-error" id="errorAlert">
            <i class="fas fa-exclamation-circle"></i>
            <div id="errorText"></div>
        </div>

        <div class="alert alert-success" id="successAlert">
            <i class="fas fa-check-circle"></i>
            <div id="successText"></div>
        </div>

        <!-- Rejection Modal -->
        <div class="modal-overlay" id="rejectionModal">
            <div class="modal-content rejection-modal">
                <div class="modal-icon">
                    <i class="fas fa-times-circle"></i>
                </div>
                <h2 class="modal-title">تم رفض طلب التسجيل</h2>
                <div class="modal-body" id="rejectionDetails"></div>
                <button class="modal-close-btn" onclick="closeRejectionModal()">
                    <i class="fas fa-check"></i> فهمت
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="admin@inventory.com" required autocomplete="email">
                    <i class="input-icon fas fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="input-icon fas fa-lock"></i>
                    <i class="password-toggle fas fa-eye" id="togglePassword"></i>
                </div>
                <div class="forgot-password">
                    <a href="#" onclick="alert('يرجى التواصل مع المدير لإعادة تعيين كلمة المرور'); return false;">
                        نسيت كلمة المرور؟
                    </a>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i>
                <span>تسجيل الدخول</span>
            </button>
        </form>


        <!-- Divider -->
        <div class="divider">
            <span>أو</span>
        </div>

        <!-- Register Section -->
        <div class="register-section">
            <p>ليس لديك حساب؟ 🎯</p>
            <a href="register-request.html" class="btn-register-request">
                <i class="fas fa-user-plus"></i>
                <span>طلب إنشاء حساب جديد</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer-text">
            <p>
                جميع الحقوق محفوظة © 2026 مخزني<br>
                <a href="#">سياسة الخصوصية</a> • <a href="#">شروط الاستخدام</a>
            </p>
        </div>
    </div>

    <script>
        // ========== إنشاء Particles ==========
        function createParticles() {
            const bg = document.querySelector('.animated-bg');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 1;
                const startX = Math.random() * 100;
                const duration = Math.random() * 10 + 10;
                const delay = Math.random() * 5;
                
                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${startX}%;
                    bottom: -10px;
                    background: rgba(102, 126, 234, ${Math.random() * 0.5 + 0.3});
                    animation: float-up ${duration}s linear ${delay}s infinite;
                `;
                
                bg.appendChild(particle);
            }
        }

        createParticles();

        // ========== تكوين API ==========
        const API_URL = window.API_URL || 'http://localhost:5000/api';

        // ========== إظهار/إخفاء كلمة المرور ==========
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });


        // ========== دوال عرض الرسائل ==========
        function showError(message, details = null) {
            const errorAlert = document.getElementById('errorAlert');
            const errorText = document.getElementById('errorText');
            
            let html = `<strong>❌ ${message}</strong>`;
            
            if (details) {
                if (details.rejectedBy) {
                    html += `<p><i class="fas fa-user-shield"></i> <span>تم الرفض بواسطة: <strong>${details.rejectedBy}</strong></span></p>`;
                }
                if (details.rejectionReason) {
                    html += `<p><i class="fas fa-comment-dots"></i> <span>السبب: ${details.rejectionReason}</span></p>`;
                }
                if (details.rejectedAt) {
                    const rejectionDate = new Date(details.rejectedAt);
                    const formattedDate = rejectionDate.toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    html += `<p><i class="fas fa-calendar-times"></i> <span>تاريخ الرفض: ${formattedDate}</span></p>`;
                }
                html += `<p style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(252, 129, 129, 0.2);"><i class="fas fa-info-circle"></i> <span>يرجى التواصل مع المدير للمزيد من المعلومات</span></p>`;
            }
            
            errorText.innerHTML = html;
            errorAlert.style.display = 'flex';
            
            // إخفاء بعد 15 ثانية
            setTimeout(() => {
                errorAlert.style.display = 'none';
            }, 15000);
        }

        function showSuccess(message) {
            const successAlert = document.getElementById('successAlert');
            const successText = document.getElementById('successText');
            successText.innerHTML = `<strong>✅ ${message}</strong>`;
            successAlert.style.display = 'flex';
            
            setTimeout(() => {
                successAlert.style.display = 'none';
            }, 5000);
        }

        // ========== دوال الـ Rejection Modal ==========
        function showRejectionModal(details) {
            const modal = document.getElementById('rejectionModal');
            const detailsContainer = document.getElementById('rejectionDetails');
            
            let html = '';
            
            if (details.rejectedBy) {
                html += `
                    <div class="modal-info-item">
                        <i class="fas fa-user-shield"></i>
                        <div class="modal-info-content">
                            <div class="modal-info-label">تم الرفض بواسطة</div>
                            <div class="modal-info-value">${details.rejectedBy}</div>
                        </div>
                    </div>
                `;
            }
            
            if (details.rejectionReason) {
                html += `
                    <div class="modal-info-item">
                        <i class="fas fa-comment-dots"></i>
                        <div class="modal-info-content">
                            <div class="modal-info-label">سبب الرفض</div>
                            <div class="modal-info-value">${details.rejectionReason}</div>
                        </div>
                    </div>
                `;
            }
            
            if (details.rejectedAt) {
                const rejectionDate = new Date(details.rejectedAt);
                const formattedDate = rejectionDate.toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                const formattedTime = rejectionDate.toLocaleTimeString('ar-EG', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                html += `
                    <div class="modal-info-item">
                        <i class="fas fa-calendar-times"></i>
                        <div class="modal-info-content">
                            <div class="modal-info-label">تاريخ الرفض</div>
                            <div class="modal-info-value">${formattedDate} - ${formattedTime}</div>
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div class="modal-footer-note">
                    <i class="fas fa-info-circle"></i>
                    <p>يرجى التواصل مع المدير (${details.rejectedBy || 'الإدارة'}) للمزيد من المعلومات أو لإعادة تقديم الطلب.</p>
                </div>
            `;
            
            detailsContainer.innerHTML = html;
            modal.classList.add('active');
        }

        function closeRejectionModal() {
            const modal = document.getElementById('rejectionModal');
            modal.classList.remove('active');
        }

        // إغلاق الـ Modal عند الضغط على الخلفية
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('rejectionModal');
            if (e.target === modal) {
                closeRejectionModal();
            }
        });

        // showNotification متوفرة في professional-toast.js
        // استخدم: showProfessionalToast(message, type, duration)

        // ========== معالجة نموذج تسجيل الدخول ==========
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('يرجى إدخال البريد الإلكتروني وكلمة المرور');
                return;
            }

            const submitBtn = this.querySelector('.btn-login');
            const btnText = submitBtn.querySelector('span');
            const originalText = btnText.textContent;
            btnText.innerHTML = '<div class="loading-spinner"></div>';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();


                if (result.success) {
                    // ✅ حفظ Token بطريقتين للتأكد
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('auth_token', result.token);
                    
                    // ✅ حفظ بيانات المستخدم
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    
                    // ✅ حفظ صلاحيات المستخدم
                    if (result.user && result.user.permissions) {
                        localStorage.setItem('user_permissions_' + result.user.id, JSON.stringify(result.user.permissions));
                    }
                    
                    console.log('✅ Token:', result.token.substring(0, 20) + '...');
                    console.log('✅ User:', result.user.name, '- Role:', result.user.role);
                    
                    showProfessionalToast(`مرحباً ${result.user.name}! ✨ جاري التحويل...`, 'success');
                    
                    setTimeout(() => {
                        const userRole = result.user.role;
                        
                        console.log('🔄 Redirecting user with role:', userRole);
                        
                        // ✅ التحويل المباشر حسب الدور مع تحسين الـ path
                        let targetPage = 'index.html';
                        
                        if (userRole === 'admin') {
                            targetPage = 'index.html';
                        } else if (userRole === 'storekeeper') {
                            targetPage = 'storekeeper.html';
                        } else if (userRole === 'cashier') {
                            targetPage = 'pos.html';
                        } else if (userRole === 'accountant') {
                            targetPage = 'reports.html';
                        } else if (userRole === 'reviewer') {
                            targetPage = 'audit.html';
                        }
                        
                        console.log('🎯 Target page:', targetPage);
                        console.log('📍 Current location:', window.location.href);
                        console.log('📂 Will redirect to:', window.location.origin + '/' + targetPage);
                        
                        // استخدام href بدلاً من replace للتأكد من التحويل الصحيح
                        window.location.href = targetPage;
                    }, 1200);
                } else {
                    // التحقق من رسائل الخطأ الخاصة بالحسابات المرفوضة
                    if (result.code === 'ACCOUNT_REJECTED' || result.message?.includes('مرفوض')) {
                        // عرض الـ Modal للحساب المرفوض
                        showRejectionModal({
                            rejectedBy: result.rejectedBy || 'المدير',
                            rejectionReason: result.rejectionReason || 'لم يتم تحديد سبب',
                            rejectedAt: result.rejectedAt || null
                        });
                        
                        showProfessionalToast('⛔ حساب مرفوض', 'error', 5000);
                    } else {
                        showError(result.message || 'فشل تسجيل الدخول. تحقق من البيانات المدخلة');
                        showProfessionalToast('فشل تسجيل الدخول ❌', 'error');
                    }
                    
                    btnText.textContent = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('حدث خطأ في الاتصال بالسيرفر. تأكد أن السيرفر يعمل');
                showProfessionalToast('خطأ في الاتصال بالسيرفر ⚠️', 'error');
                btnText.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        // ========== التحقق من تسجيل الدخول السابق ==========
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                try {
                    const user = JSON.parse(currentUser);
                    showProfessionalToast(`مرحباً ${user.name}! أنت مسجل دخول بالفعل 🎉`, 'success');
                    setTimeout(() => {
                        // ✅ استخدام الدالة المركزية للتحويل
                        if (typeof redirectToUserHomePage === 'function') {
                            redirectToUserHomePage(user);
                        } else {
                            // Fallback
                            if (user.role === 'admin') {
                                window.location.href = 'index.html';
                            } else if (user.role === 'storekeeper') {
                                window.location.href = 'storekeeper.html';
                            } else if (user.role === 'cashier') {
                                window.location.href = 'pos.html';
                            } else if (user.role === 'accountant') {
                                window.location.href = 'reports.html';
                            } else if (user.role === 'reviewer') {
                                window.location.href = 'audit.html';
                            } else {
                                window.location.href = 'index.html';
                            }
                        }
                    }, 1500);
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        });

        // ========== تأثيرات إضافية على الـ inputs ==========
        const inputs = document.querySelectorAll('.input-wrapper input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
    <script src="config.js"></script>
    <script src="professional-toast.js"></script>
    </body>
</html>
