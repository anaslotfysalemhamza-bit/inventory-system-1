<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك - نظام إدارة المخازن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme-engine.js"></script>
    <style>
        /* ============================================================
           🎨 صفحة ترحيب احترافية جداً
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ===== خلفية متحركة 3D ===== */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }

        .bg-orb:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #10b981, #059669);
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }

        .bg-orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #4361ee, #3a0ca3);
            bottom: -200px;
            left: -200px;
            animation-delay: -8s;
        }

        .bg-orb:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8b5cf6, #7c3aed);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -16s;
            opacity: 0.15;
        }

        .bg-orb:nth-child(4) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #f59e0b, #d97706);
            top: 20%;
            right: 20%;
            animation-delay: -4s;
            opacity: 0.2;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }

            25% {
                transform: translate(50px, -60px) scale(1.1) rotate(5deg);
            }

            50% {
                transform: translate(-40px, 50px) scale(0.9) rotate(-5deg);
            }

            75% {
                transform: translate(30px, -30px) scale(1.05) rotate(3deg);
            }
        }

        /* ===== جسيمات متحركة ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.12);
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== الحاوية الرئيسية ===== */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 560px;
            width: 100%;
            padding: 20px;
            animation: containerEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerEntrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(40px) rotate(-5deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotate(0);
            }
        }

        /* ===== البطاقة الرئيسية ===== */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 50px 45px 45px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #4361ee, #8b5cf6, #f59e0b, #10b981);
            background-size: 300% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 300% 0%;
            }
        }

        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(16, 185, 129, 0.05), transparent 60%);
            animation: cardShine 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes cardShine {
            0% {
                transform: translate(-10%, -10%) rotate(0deg);
            }

            100% {
                transform: translate(10%, 10%) rotate(5deg);
            }
        }

        /* ===== أيقونة النجاح ===== */
        .success-icon {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
        }

        .icon-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(16, 185, 129, 0.3);
            animation: ringExpand 2.5s ease-out infinite;
        }

        .icon-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            animation-delay: 0s;
        }

        .icon-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            animation-delay: 0.4s;
        }

        .icon-ring:nth-child(3) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            animation-delay: 0.8s;
        }

        @keyframes ringExpand {
            0% {
                transform: scale(0.9);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        .icon-bg {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 2px solid rgba(16, 185, 129, 0.2);
            animation: iconPulse 3s ease-in-out infinite;
        }

        .icon-bg i {
            font-size: 56px;
            color: #10b981;
            filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.3));
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 40px rgba(16, 185, 129, 0.1);
            }

            50% {
                transform: scale(1.02);
                box-shadow: 0 0 60px rgba(16, 185, 129, 0.2);
            }
        }

        @keyframes iconBounce {

            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }

            50% {
                transform: scale(1.1) rotate(5deg);
            }
        }

        /* ===== النصوص ===== */
        .card h1 {
            font-size: 32px;
            font-weight: 900;
            color: white;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .card h1 .highlight {
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .card .subtitle i {
            color: #10b981;
            margin-left: 6px;
        }

        .card .description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.9;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .card .description strong {
            color: #10b981;
            font-weight: 700;
        }

        /* ===== معلومات المستخدم ===== */
        .user-info-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: right;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .user-info-box:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .user-info-box .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 800;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .user-info-box .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info-box .info {
            flex: 1;
        }

        .user-info-box .info .name {
            font-size: 17px;
            font-weight: 700;
            color: white;
            margin-bottom: 2px;
        }

        .user-info-box .info .role {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .user-info-box .info .role i {
            color: #10b981;
            margin-left: 4px;
        }

        .user-info-box .badge {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            white-space: nowrap;
        }

        /* ===== الأزرار ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 14px 34px;
            border-radius: 18px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 25px rgba(16, 185, 129, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 40px rgba(16, 185, 129, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-outline {
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn i {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: translateX(-3px);
        }

        /* ===== المميزات ===== */
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .feature-item i {
            color: #10b981;
            font-size: 13px;
        }

        /* ===== مؤشر التحميل ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-spinner p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 500;
        }

        /* ============================================================
           📱 RESPONSIVE
           ============================================================ */

        @media (max-width: 550px) {
            .card {
                padding: 30px 20px 25px;
                border-radius: 28px;
            }

            .card h1 {
                font-size: 26px;
            }

            .success-icon {
                width: 100px;
                height: 100px;
            }

            .success-icon .icon-bg i {
                font-size: 42px;
            }

            .icon-ring:nth-child(1) {
                width: 100%;
                height: 100%;
            }

            .icon-ring:nth-child(2) {
                width: 85%;
                height: 85%;
                top: 7.5%;
                left: 7.5%;
            }

            .icon-ring:nth-child(3) {
                width: 70%;
                height: 70%;
                top: 15%;
                left: 15%;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 24px;
            }

            .btn-group {
                flex-direction: column;
            }

            .user-info-box {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }

            .user-info-box .avatar {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }

            .features {
                gap: 15px;
            }

            .container {
                padding: 15px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 20px 14px 18px;
            }

            .card h1 {
                font-size: 22px;
            }

            .success-icon {
                width: 80px;
                height: 80px;
            }

            .success-icon .icon-bg i {
                font-size: 34px;
            }
        }

        /* ===== Reduce Motion ===== */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ===== خلفية متحركة 3D ===== -->
    <div class="bg-container">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
    </div>

    <!-- ===== جسيمات ===== -->
    <div class="particles" id="particles"></div>

    <!-- ===== مؤشر التحميل ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>🔄 جاري توجيهك...</p>
        </div>
    </div>

    <!-- ===== الحاوية ===== -->
    <div class="container">
        <div class="card">

            <!-- ===== أيقونة النجاح ===== -->
            <div class="success-icon">
                <div class="icon-ring"></div>
                <div class="icon-ring"></div>
                <div class="icon-ring"></div>
                <div class="icon-bg">
                    <i class="fas fa-check-circle"></i>
                </div>
            </div>

            <!-- ===== النصوص ===== -->
            <h1>مرحباً بك <span class="highlight">في نظامك</span></h1>
            <p class="subtitle">
                <i class="fas fa-check-circle"></i>
                تم التحقق من صلاحياتك بنجاح
            </p>

            <p class="description">
                <strong>🎯 جاري توجيهك:</strong> سيتم نقلك إلى لوحة التحكم الشخصية.<br>
                ستظهر لك فقط الصلاحيات المتاحة لك حسب دورك الوظيفي.
            </p>

            <!-- ===== معلومات المستخدم ===== -->
            <div class="user-info-box" id="userInfoBox">
                <div class="avatar" id="userAvatar">أ</div>
                <div class="info">
                    <div class="name" id="userNameDisplay">---</div>
                    <div class="role" id="userRoleDisplay">
                        <i class="fas fa-check-circle"></i> أمين مخزن
                    </div>
                </div>
                <span class="badge">✅ صلاحيات مفعلة</span>
            </div>

            <!-- ===== الأزرار ===== -->
            <div class="btn-group">
                <button onclick="goToDashboard()" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> الذهاب للوحة التحكم
                </button>
                <button onclick="window.location.href='profile.html'" class="btn btn-secondary">
                    <i class="fas fa-user-cog"></i> الملف الشخصي
                </button>
                <button onclick="logout()" class="btn btn-outline">
                    <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                </button>
            </div>

            <!-- ===== المميزات ===== -->
            <div class="features">
                <span class="feature-item"><i class="fas fa-shield-alt"></i> حساب آمن</span>
                <span class="feature-item"><i class="fas fa-user-check"></i> صلاحيات مخصصة</span>
                <span class="feature-item"><i class="fas fa-clock"></i> 24/7</span>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        (function () {
            'use strict';

            // ============================================================
            // CONFIGURATION
            // ============================================================
            const API_URL = window.API_URL || 'http://localhost:5000/api';
            let currentUser = null;

            // ============================================================
            // DOM REFS
            // ============================================================
            const $ = (id) => document.getElementById(id);
            const loadingOverlay = $('loadingOverlay');
            const userAvatar = $('userAvatar');
            const userNameDisplay = $('userNameDisplay');
            const userRoleDisplay = $('userRoleDisplay');

            // ============================================================
            // PARTICLES
            // ============================================================
            function createParticles() {
                const container = document.getElementById('particles');
                if (!container) return;

                const particleCount = 40;
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const size = Math.random() * 4 + 2;
                    const left = Math.random() * 100;
                    const duration = Math.random() * 15 + 10;
                    const delay = Math.random() * 10;

                    particle.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        left: ${left}%;
                        animation-duration: ${duration}s;
                        animation-delay: ${delay}s;
                    `;

                    container.appendChild(particle);
                }
            }

            // ============================================================
            // UPDATE USER INFO
            // ============================================================
            function updateUserInfo() {
                currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!currentUser) return;

                // الاسم
                if (userNameDisplay) {
                    userNameDisplay.textContent = currentUser.name || 'مستخدم';
                }

                // الدور
                const roleNames = {
                    'admin': 'مدير النظام',
                    'storekeeper': 'أمين مخزن',
                    'cashier': 'كاشير'
                };
                if (userRoleDisplay) {
                    userRoleDisplay.innerHTML = `<i class="fas fa-check-circle"></i> ${roleNames[currentUser.role] || currentUser.role}`;
                }

                // الصورة الشخصية
                if (userAvatar) {
                    const profilePicture = localStorage.getItem('user_profile_picture_' + currentUser.id);
                    if (profilePicture && profilePicture !== 'null' && profilePicture !== 'undefined') {
                        userAvatar.innerHTML = `<img src="${profilePicture}" alt="${currentUser.name}">`;
                    } else {
                        const initials = (currentUser.name || 'أ').charAt(0).toUpperCase();
                        userAvatar.textContent = initials;
                        userAvatar.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
                    }
                }
            }

            // ============================================================
            // ✅ التوجيه الفوري (بدون أي تأخير)
            // ============================================================
            function redirectNow() {
                currentUser = JSON.parse(localStorage.getItem('currentUser'));

                // لو مفيش مستخدم → login
                if (!currentUser) {
                    window.location.href = 'login.html';
                    return;
                }

                console.log('👤 المستخدم:', currentUser.name);
                console.log('🎯 الدور:', currentUser.role);

                // ✅ أمين المخزن → Dashboard
                if (currentUser.role === 'storekeeper') {
                    console.log('✅ أمين مخزن => dashboard');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // ✅ المدير → Dashboard
                if (currentUser.role === 'admin') {
                    console.log('✅ مدير => dashboard');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // ✅ الكاشير → POS
                if (currentUser.role === 'cashier') {
                    console.log('✅ كاشير => pos.html');
                    window.location.href = 'pos.html';
                    return;
                }

                // لو أي دور تاني → login
                window.location.href = 'login.html';
            }

            // ============================================================
            // GO TO DASHBOARD (للزر)
            // ============================================================
            function goToDashboard() {
                window.location.href = 'dashboard.html';
            }

            // ============================================================
            // LOGOUT
            // ============================================================
            function logout() {
                if (confirm('هل تريد تسجيل الخروج؟')) {
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('auth_token');
                    if (currentUser && currentUser.id) {
                        localStorage.removeItem('user_permissions_' + currentUser.id);
                    }
                    window.location.href = 'login.html';
                }
            }

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                createParticles();
                updateUserInfo();

                // ✅ التوجيه الفوري خلال 300ms فقط عشان يظهر التصميم
                setTimeout(function () {
                    redirectNow();
                }, 300);

                console.log('✅ Storekeeper page initialized (professional version)');
            }

            // ============================================================
            // EXPOSE GLOBALS
            // ============================================================
            window.goToDashboard = goToDashboard;
            window.logout = logout;

            // تشغيل الصفحة
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>

</html>
